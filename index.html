<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Versículo</title>
  <meta name="description" content="Meu Versículo — receba diariamente um versículo da Bíblia selecionado para você.">
  <style>
    :root {
      --fundo: #ffffff;
      --texto: #111111;
      --texto-suave: #3a3a3c;
      --acento: #AF26C9;
      --acento-suave: rgba(175, 38, 201, 0.08);
      --hairline: rgba(0, 0, 0, 0.12);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fundo: #101014;
        --texto: #f2f2f7;
        --texto-suave: #b9b9c0;
        --acento: #d36ae6;
        --acento-suave: rgba(211, 106, 230, 0.14);
        --hairline: rgba(255, 255, 255, 0.16);
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--fundo);
      color: var(--texto);
      font-family: "New York", "Iowan Old Style", Georgia, "Times New Roman", serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }
    h1 { font-size: 2.4rem; margin-bottom: 10px; }
    .subtitulo {
      color: var(--texto-suave);
      max-width: 420px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .botao {
      display: inline-block;
      background: var(--acento);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      padding: 14px 28px;
      border-radius: 14px;
      margin-bottom: 40px;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      font-size: 0.85rem;
    }
    .rotulo {
      width: 100%;
      color: var(--texto-suave);
      margin-bottom: 4px;
    }
    nav a {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid var(--hairline);
      color: var(--texto-suave);
      text-decoration: none;
      transition: border-color 0.15s ease, color 0.15s ease;
    }
    nav a:hover { border-color: var(--acento); color: var(--acento); }
    nav .bandeira { font-size: 1rem; line-height: 1; }
  </style>
</head>
<body>
  <h1>Meu Versículo</h1>
  <p class="subtitulo">Receba diariamente um versículo da Bíblia selecionado
  especialmente para você — com reflexões, orações e imagens para
  compartilhar.</p>
  <a class="botao" href="https://apps.apple.com/br/app/meu-vers%C3%ADculo/id1667175912" rel="noopener">Baixar na App Store</a>
  <nav aria-label="Política de privacidade">
    <span class="rotulo">Política de Privacidade</span>
    <a href="privacidade.html" hreflang="pt-BR"><span class="bandeira">🇧🇷</span> Português</a>
    <a href="privacy.html" hreflang="en"><span class="bandeira">🇺🇸</span> English</a>
    <a href="privacidad.html" hreflang="es"><span class="bandeira">🇪🇸</span> Español</a>
  </nav>
</body>
</html>
